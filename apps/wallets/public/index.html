<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lomi. Wallets</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #1c1917;
        background: #f5f5f4;
      }
      body {
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      section {
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: #78716c;
        margin-bottom: 0.25rem;
      }
      input,
      button {
        font: inherit;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background: #1d4ed8;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      pre {
        background: #fafaf9;
        padding: 0.75rem;
        font-size: 0.75rem;
        overflow: auto;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>lomi. Wallets (sandbox)</h1>
    <p>Claim a handle, fund an account wallet, create a virtual wallet for agents.</p>

    <section>
      <h2>1. Owner session</h2>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@company.com" />
      <button type="button" id="btn-session">Create session</button>
    </section>

    <section>
      <h2>2. Claim handle</h2>
      <label>Handle</label>
      <input id="handle" placeholder="acme" />
      <button type="button" id="btn-claim">Claim acme.lomi.pay</button>
    </section>

    <section>
      <h2>3. Fund account wallet</h2>
      <label>Amount (USD mock)</label>
      <input id="fund-amount" type="number" value="10" step="0.01" />
      <button type="button" id="btn-fund">Mock fund</button>
    </section>

    <section>
      <h2>4. Virtual wallet</h2>
      <label>Agent slug</label>
      <input id="agent-slug" placeholder="research" />
      <label>Period allowance (USD)</label>
      <input id="period-allowance" type="number" value="2" step="0.01" />
      <label>Max transaction (USD)</label>
      <input id="max-tx" type="number" value="0.5" step="0.01" />
      <label>Allowlist (comma-separated hosts)</label>
      <input id="allowlist" placeholder="api.example.com,*.openai.com" />
      <button type="button" id="btn-vw">Create virtual wallet</button>
    </section>

    <pre id="log">Ready.</pre>

    <script>
      const log = document.getElementById('log');
      let token = '';
      let accountWalletId = '';

      function write(obj) {
        log.textContent = JSON.stringify(obj, null, 2);
      }

      async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) headers.Authorization = 'Bearer ' + token;
        const res = await fetch(path, { ...options, headers });
        const body = await res.json();
        if (!res.ok) throw body;
        return body;
      }

      document.getElementById('btn-session').onclick = async () => {
        try {
          const email = document.getElementById('email').value;
          const data = await api('/v1/sessions', {
            method: 'POST',
            body: JSON.stringify({ email }),
          });
          token = data.token;
          write(data);
        } catch (e) {
          write(e);
        }
      };

      document.getElementById('btn-claim').onclick = async () => {
        try {
          const handle = document.getElementById('handle').value;
          const data = await api('/v1/handles/claim', {
            method: 'POST',
            body: JSON.stringify({ handle }),
          });
          accountWalletId = data.account_wallet_id;
          write(data);
        } catch (e) {
          write(e);
        }
      };

      document.getElementById('btn-fund').onclick = async () => {
        try {
          if (!accountWalletId) {
            const aw = await api('/v1/account-wallets', { method: 'POST' });
            accountWalletId = aw.account_wallet.id;
          }
          const amount = Number(document.getElementById('fund-amount').value);
          const data = await api(`/v1/account-wallets/${accountWalletId}/fund`, {
            method: 'POST',
            body: JSON.stringify({ amount }),
          });
          write(data);
        } catch (e) {
          write(e);
        }
      };

      document.getElementById('btn-vw').onclick = async () => {
        try {
          if (!accountWalletId) throw { error: 'Claim a handle first' };
          const allowRaw = document.getElementById('allowlist').value;
          const allowlist = allowRaw
            ? allowRaw.split(',').map((s) => s.trim()).filter(Boolean)
            : undefined;
          const data = await api('/v1/virtual-wallets', {
            method: 'POST',
            body: JSON.stringify({
              account_wallet_id: accountWalletId,
              agent_slug: document.getElementById('agent-slug').value,
              period_allowance: Number(document.getElementById('period-allowance').value),
              max_transaction: Number(document.getElementById('max-tx').value),
              allowlist,
            }),
          });
          write(data);
        } catch (e) {
          write(e);
        }
      };
    </script>
  </body>
</html>
