name: Set up IPv6 egress
description: Cloudflare WARP IPv6 egress for direct Supabase db.<ref>.supabase.co hosts
runs:
  using: composite
  steps:
    - name: Set up IPv6 egress (Cloudflare WARP)
      uses: fscarmen/warp-on-actions@v1.4
      with:
        stack: ipv6
        mode: wireguard

    - name: Verify IPv6 connectivity
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5 6; do
          if curl -6 -fsS -m 10 https://api64.ipify.org >/dev/null 2>&1; then
            echo "IPv6 egress is up."
            exit 0
          fi
          echo "IPv6 not ready yet (attempt ${attempt}); waiting..."
          sleep 5
        done
        echo "::error::IPv6 egress is not available after WARP setup."
        exit 2
