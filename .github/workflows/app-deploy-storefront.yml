name: lomi · deploy · storefront

on:
  repository_dispatch:
    types: [lomi-deploy-storefront]
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - ".github/workflows/app-deploy-storefront.yml"
      - ".github/actions/checkout-private-app/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-storefront-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load local actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/checkout-private-app

      - name: Checkout app source
        uses: ./.github/actions/checkout-private-app
        with:
          repository: lomiafrica/storefront
          submodule-path: apps/storefront
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          event-name: ${{ github.event_name }}
          workflow-ref: ${{ inputs.ref }}
          dispatch-sha: ${{ github.event.client_payload.sha }}


      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STOREFRONT }}
          working-directory: ${{ github.workspace }}
          target: ${{ github.event.client_payload.target || 'production' }}
