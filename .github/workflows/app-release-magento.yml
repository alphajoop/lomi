name: lomi · release · magento

on:
  push:
    tags:
      - "magento-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/app-release-plugin.yml
    with:
      plugin: magento
      submodule-path: apps/plugins/magento
      zip-source: .
      artifact: magento-lomi.zip
      tag-prefix: magento-v
