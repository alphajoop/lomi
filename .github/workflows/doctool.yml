name: doctool

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/docs/**"
      - "apps/mcp/**"
      - "apps/sdks/ts/src/generated/**"
      - ".github/workflows/doctool.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/doctool.yml"

jobs:
  build-doctool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: lomiafrica/doctool
          path: apps/doctool
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - name: Build doctool (dt)
        working-directory: apps/doctool
        run: cargo build --release -p doctool-cli
      - name: Run doctool tests
        working-directory: apps/doctool
        run: cargo test --workspace
      - name: Install docs dependencies
        working-directory: apps/docs
        run: pnpm install
      - name: dt check
        run: ./apps/doctool/target/release/dt check --root .
