name: lomi · ci · assistant

on:
  pull_request:
    paths:
      - "apps/api/src/merchant-assistant/**"
      - "apps/dashboard/src/lib/assistant/**"
      - "apps/dashboard/scripts/build/generate-assistant-tool-manifest.mjs"
      - ".github/workflows/app-ci-assistant.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/src/merchant-assistant/**"
      - "apps/dashboard/src/lib/assistant/**"
      - "apps/dashboard/scripts/build/generate-assistant-tool-manifest.mjs"
      - ".github/workflows/app-ci-assistant.yml"

jobs:
  assistant-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init private submodules
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh apps/api apps/dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate tool manifest
        working-directory: apps/dashboard
        run: node scripts/build/generate-assistant-tool-manifest.mjs

      - name: Check manifest drift
        working-directory: apps/dashboard
        run: |
          git diff --exit-code src/lib/assistant/tool-manifest.generated.json src/lib/assistant/ui-tool-ids.generated.ts
