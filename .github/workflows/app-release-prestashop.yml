name: lomi · release · prestashop

on:
  push:
    tags:
      - "prestashop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/app-release-plugin.yml
    with:
      plugin: prestashop
      submodule-path: apps/plugins/prestashop
      zip-source: lomi
      artifact: prestashop-lomi.zip
      tag-prefix: prestashop-v
