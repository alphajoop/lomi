name: lomi · deploy · website

on:
  repository_dispatch:
    types: [lomi-deploy-website]
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/app-deploy-website.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-website-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Load local actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/checkout-app-submodule

      - name: Checkout app source
        id: checkout-app
        uses: ./.github/actions/checkout-app-submodule
        with:
          repository: lomiafrica/website
          submodule-path: apps/website
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          event-name: ${{ github.event_name }}
          workflow-ref: ${{ inputs.ref }}
          dispatch-sha: ${{ github.event.client_payload.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.checkout-app.outputs.app-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.checkout-app.outputs.app-path }}
      - run: pnpm lint
        working-directory: ${{ steps.checkout-app.outputs.app-path }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: verify
    if: |
      github.event.client_payload.target == 'production' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Load local actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/checkout-app-submodule

      - name: Checkout app source
        id: checkout-app
        uses: ./.github/actions/checkout-app-submodule
        with:
          repository: lomiafrica/website
          submodule-path: apps/website
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          event-name: ${{ github.event_name }}
          workflow-ref: ${{ inputs.ref }}
          dispatch-sha: ${{ github.event.client_payload.sha }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: ${{ github.workspace }}/${{ steps.checkout-app.outputs.app-path }}
          target: production
