name: lomi · deploy · website

on:
  repository_dispatch:
    types: [lomi-deploy-website]
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/app-deploy-website.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-website-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo pointer
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Resolve app ref
        id: app-ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="$(git rev-parse "HEAD:apps/website")"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/heads/${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/website
          ref: ${{ steps.app-ref.outputs.ref }}
          token: ${{ secrets.REPO_CHECKOUT_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: verify
    if: |
      github.event.client_payload.target == 'production' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo pointer
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Resolve app ref
        id: app-ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="$(git rev-parse "HEAD:apps/website")"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/heads/${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/website
          ref: ${{ steps.app-ref.outputs.ref }}
          token: ${{ secrets.REPO_CHECKOUT_PAT }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: ${{ github.workspace }}
          target: production
