name: lomi · deploy · checkout

on:
  repository_dispatch:
    types: [lomi-deploy-checkout]
  push:
    branches: [main]
    paths:
      - "apps/checkout/**"
      - ".github/workflows/app-deploy-checkout.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-checkout-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from private repository
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/checkout
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.ref) || github.event.client_payload.sha }}
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          path: apps/checkout

      - name: Checkout monorepo submodule
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          submodules: apps/checkout
          token: ${{ secrets.REPO_CHECKOUT_PAT }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CHECKOUT }}
          working-directory: apps/checkout
          target: ${{ github.event.client_payload.target || 'production' }}

