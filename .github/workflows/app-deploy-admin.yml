name: lomi · deploy · admin

on:
  repository_dispatch:
    types: [lomi-deploy-admin]
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/app-deploy-admin.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-admin-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo pointer
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Resolve app ref
        id: app-ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="$(git rev-parse "HEAD:apps/admin")"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/heads/${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/admin.lomi.africa
          ref: ${{ steps.app-ref.outputs.ref }}
          token: ${{ secrets.REPO_CHECKOUT_PAT }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: ${{ github.workspace }}
          target: ${{ github.event.client_payload.target || 'production' }}
