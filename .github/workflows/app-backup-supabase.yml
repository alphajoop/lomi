name: lomi · backup · supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,14 * * *"

concurrency:
  group: lomi-backup-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up database and storage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
      SUPABASE_STORAGE_S3_REGION: ${{ secrets.SUPABASE_STORAGE_S3_REGION }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail

          missing=0

          normalize_env_value() {
            local name="$1"
            local required="${2:-required}"
            local raw="${!name-}"
            local normalized

            normalized="$(printf '%s' "$raw" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

            if [ -z "$normalized" ]; then
              if [ "$required" = "required" ]; then
                echo "::error::Missing required secret: ${name}"
                missing=1
              fi
              return
            fi

            if [ "$raw" != "$normalized" ]; then
              echo "::warning::${name} contained leading/trailing whitespace or line breaks; using a trimmed single-line value."
            fi

            export "$name=$normalized"
            printf '%s=%s\n' "$name" "$normalized" >> "$GITHUB_ENV"
          }

          for name in \
            SUPABASE_DB_URL \
            SUPABASE_STORAGE_S3_ENDPOINT \
            SUPABASE_STORAGE_S3_REGION \
            SUPABASE_STORAGE_S3_ACCESS_KEY_ID \
            SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY \
            BACKUP_S3_BUCKET \
            BACKUP_S3_ENDPOINT \
            BACKUP_S3_ACCESS_KEY_ID \
            BACKUP_S3_SECRET_ACCESS_KEY \
            AGE_PUBLIC_KEY
          do
            normalize_env_value "$name"
          done

          normalize_env_value BACKUP_S3_PREFIX optional
          normalize_env_value BACKUP_S3_REGION optional

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if printf '%s' "$SUPABASE_DB_URL" | grep -q '[[:space:]]'; then
            echo "::error::SUPABASE_DB_URL must be a single-line Postgres connection string with no literal whitespace."
            exit 1
          fi

          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must start with postgres:// or postgresql://."
              exit 1
              ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install backup tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age jq rclone

      - name: Create database dump
        id: db-dump
        run: |
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${BACKUP_S3_REGION:-auto}"
          export AWS_EC2_METADATA_DISABLED="true"

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          backup_dir="supabase-db-${timestamp}"
          archive="${backup_dir}.tar.gz"
          encrypted_archive="${archive}.age"
          checksum_file="${encrypted_archive}.sha256"
          manifest_file="${backup_dir}.manifest.json"
          prefix="${BACKUP_S3_PREFIX:-supabase}"
          latest_manifest="latest-db-manifest.json"
          endpoint_args=()

          if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then
            endpoint_args=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          fi

          mkdir -p "$backup_dir"

          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$backup_dir/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$backup_dir/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$backup_dir/data.sql" --data-only --use-copy -x storage.buckets_vectors -x storage.vector_indexes

          db_content_sha="$(
            sha256sum "$backup_dir/roles.sql" "$backup_dir/schema.sql" "$backup_dir/data.sql" \
              | sha256sum \
              | awk '{print $1}'
          )"

          previous_db_content_sha=""
          if aws s3 cp "s3://${BACKUP_S3_BUCKET}/${prefix}/db/latest-manifest.json" "$latest_manifest" "${endpoint_args[@]}" --only-show-errors; then
            previous_db_content_sha="$(jq -r '.db_content_sha // empty' "$latest_manifest")"
          fi

          if [ "$db_content_sha" = "$previous_db_content_sha" ]; then
            echo "DB_CHANGED=false" >> "$GITHUB_ENV"
            echo "Database dump content matches the latest uploaded backup; skipping DB archive upload."
            exit 0
          fi

          {
            echo "Backup created at ${timestamp}"
            echo
            echo "Restore order:"
            echo "1. roles.sql"
            echo "2. schema.sql"
            echo "3. data.sql"
          } > "$backup_dir/RESTORE.txt"

          tar -czf "$archive" "$backup_dir"
          age --recipient "$AGE_PUBLIC_KEY" --output "$encrypted_archive" "$archive"
          sha256sum "$encrypted_archive" > "$checksum_file"

          jq -n \
            --arg created_at "$timestamp" \
            --arg backup_file "$encrypted_archive" \
            --arg checksum_file "$checksum_file" \
            --arg db_content_sha "$db_content_sha" \
            '{
              created_at: $created_at,
              backup_file: $backup_file,
              checksum_file: $checksum_file,
              db_content_sha: $db_content_sha
            }' > "$manifest_file"

          echo "DB_CHANGED=true" >> "$GITHUB_ENV"
          echo "DB_BACKUP_FILE=$encrypted_archive" >> "$GITHUB_ENV"
          echo "DB_CHECKSUM_FILE=$checksum_file" >> "$GITHUB_ENV"
          echo "DB_MANIFEST_FILE=$manifest_file" >> "$GITHUB_ENV"

      - name: Upload database backup to object storage
        if: env.DB_CHANGED == 'true'
        run: |
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${BACKUP_S3_REGION:-auto}"
          export AWS_EC2_METADATA_DISABLED="true"

          prefix="${BACKUP_S3_PREFIX:-supabase}"
          destination="s3://${BACKUP_S3_BUCKET}/${prefix}/db"
          endpoint_args=()

          if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then
            endpoint_args=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          fi

          aws s3 cp "$DB_BACKUP_FILE" "$destination/$DB_BACKUP_FILE" "${endpoint_args[@]}" --only-show-errors
          aws s3 cp "$DB_CHECKSUM_FILE" "$destination/$DB_CHECKSUM_FILE" "${endpoint_args[@]}" --only-show-errors
          aws s3 cp "$DB_MANIFEST_FILE" "$destination/latest-manifest.json" "${endpoint_args[@]}" --only-show-errors

          echo "Uploaded encrypted database backup to $destination/$DB_BACKUP_FILE"

      - name: Copy Supabase Storage buckets to object storage
        env:
          RCLONE_CONFIG_SUPABASE_TYPE: s3
          RCLONE_CONFIG_SUPABASE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASE_ENV_AUTH: "false"
          RCLONE_CONFIG_SUPABASE_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_BACKUP_TYPE: s3
          RCLONE_CONFIG_BACKUP_PROVIDER: Other
          RCLONE_CONFIG_BACKUP_ENV_AUTH: "false"
          RCLONE_CONFIG_BACKUP_FORCE_PATH_STYLE: "true"
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_SUPABASE_ENDPOINT="$SUPABASE_STORAGE_S3_ENDPOINT"
          export RCLONE_CONFIG_SUPABASE_REGION="$SUPABASE_STORAGE_S3_REGION"
          export RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID="$SUPABASE_STORAGE_S3_ACCESS_KEY_ID"
          export RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY="$SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_BACKUP_ENDPOINT="$BACKUP_S3_ENDPOINT"
          export RCLONE_CONFIG_BACKUP_REGION="${BACKUP_S3_REGION:-auto}"
          export RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
          export RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          prefix="${BACKUP_S3_PREFIX:-supabase}"

          mapfile -t buckets < <(rclone lsf supabase: --dirs-only | sed 's#/$##' | sed '/^$/d')

          if [ "${#buckets[@]}" -eq 0 ]; then
            echo "No Supabase Storage buckets found."
            exit 0
          fi

          for bucket in "${buckets[@]}"; do
            echo "Backing up Supabase Storage bucket: ${bucket}"
            rclone copy \
              "supabase:${bucket}" \
              "backup:${BACKUP_S3_BUCKET}/${prefix}/storage/${bucket}" \
              --backup-dir "backup:${BACKUP_S3_BUCKET}/${prefix}/storage-versions/${timestamp}/${bucket}" \
              --fast-list \
              --transfers 8 \
              --checkers 16 \
              --stats-one-line \
              --stats 30s
          done
