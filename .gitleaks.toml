# Gitleaks allowlist for lomi. monorepo.
# See https://github.com/gitleaks/gitleaks#configuration
#
# Note: [[rules]] ADD detectors. To ignore known-safe fixtures/docs, use [[allowlists]].

title = "lomi gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Documented sandbox test keys and example API snippets in docs/tests"
regexTarget = "match"
regexes = [
  '''lomi_sk_test_[a-zA-Z0-9_]+''',
  '''lomi_pk_test_[a-zA-Z0-9_]+''',
]
paths = [
  '''apps/docs/''',
  '''apps/api/test/''',
  '''apps/mcp/test/''',
  '''\.md$''',
  '''\.mdx$''',
  '''\.ts$''',
  '''\.tsx$''',
]

[[allowlists]]
description = "Stripe documented test PANs in sandbox payment docs"
regexTarget = "match"
regexes = [
  '''4242\s*4242\s*4242\s*4242''',
]
paths = [
  '''apps/docs/''',
  '''apps/plugins/''',
  '''\.md$''',
  '''\.mdx$''',
]
